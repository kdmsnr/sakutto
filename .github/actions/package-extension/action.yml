name: Package extension
description: Build and package the extension without a bundled model runtime.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 12.15.0

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - shell: bash
      run: pnpm zip

    - shell: bash
      run: node scripts/package-artifact.ts

    - uses: actions/upload-artifact@v7
      with:
        name: chrome-mv3-zip
        if-no-files-found: error
        compression-level: 0
        path: artifacts/store/*.zip

    - uses: actions/upload-artifact@v7
      with:
        name: chrome-mv3
        if-no-files-found: error
        compression-level: 0
        include-hidden-files: true
        path: artifacts/chrome-mv3
